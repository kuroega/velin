name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    # Keep the runner image aligned with the Visual Studio 2022 generator in
    # CMakePresets.json. The floating windows-latest image can move to an
    # image without VS 2022 installed.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-release, mingw-release]
    steps:
      - uses: actions/checkout@v4
      # The runner's preinstalled MinGW (GCC 14) lacks the media timeline
      # interfaces platform.cpp uses, so build with MSYS2's UCRT64 toolchain.
      # Both jobs also need MSYS2's Vulkan loader: FFmpeg imports vulkan-1.dll,
      # which GPU drivers normally provide and the runners lack.
      - name: Install MSYS2 packages
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-vulkan-loader
            ${{ matrix.preset == 'mingw-release' && 'mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja' || '' }}
      - name: Use the Vulkan loader
        shell: pwsh
        run: |
          # FFmpeg and libmpv both import it, from wherever the tests run them.
          $loader = Join-Path $env:RUNNER_TEMP 'vulkan-loader'
          New-Item -ItemType Directory -Force -Path $loader | Out-Null
          Copy-Item "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\vulkan-1.dll" $loader
          Add-Content -Path $env:GITHUB_PATH -Value $loader
      - name: Use MinGW toolchain
        if: matrix.preset == 'mingw-release'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - name: Fetch hash-pinned playback runtime
        shell: pwsh
        run: |
          ./scripts/Get-Mpv.ps1
          ./scripts/Get-Helpers.ps1
          ./scripts/Get-WebView2.ps1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test core behavior
        run: ctest --preset ${{ matrix.preset }}
      - name: Real playback integration
        shell: pwsh
        run: |
          ./scripts/Test-Playback.ps1 -BuildDirectory build/${{ matrix.preset }} -FFmpeg "$PWD/runtime/ffmpeg.exe" -Headless
      - name: Native GUI regression
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.preset }}/velin.exe"
          if ('${{ matrix.preset }}' -eq 'msvc-release') { $exe = "build/msvc-release/Release/velin.exe" }
          $media = Get-ChildItem .cache/playback-fixtures -Filter '*chaptered.mkv' | Select-Object -First 1
          ./scripts/Test-Gui.ps1 -Executable $exe -MediaPath $media.FullName
      - name: Relative launch and forwarding regression
        shell: powershell
        run: ./scripts/Test-LaunchPaths.ps1 -BuildDirectory build/${{ matrix.preset }}
      - name: Isolated update regression (Windows PowerShell)
        shell: powershell
        run: ./scripts/Test-Update.ps1
      - name: Isolated update regression (PowerShell 7)
        shell: pwsh
        run: ./scripts/Test-Update.ps1
      - name: Plugin windows and HTTP contracts
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.preset }}/velin.exe"
          if ('${{ matrix.preset }}' -eq 'msvc-release') { $exe = "build/msvc-release/Release/velin.exe" }
          ./scripts/Test-Extensions.ps1 -BuildDirectory build/${{ matrix.preset }}
          ./scripts/Test-PluginWindows.ps1 -Executable $exe
      - name: Package portable player
        working-directory: build/${{ matrix.preset }}
        run: cpack -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: Velin-windows-x64-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Velin-*-windows-x64.zip
